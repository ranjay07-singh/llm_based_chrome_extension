<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Instruction Structurer - Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e4e4e7;
      padding: 40px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px; color: #fff;
    }
    h1 { font-size: 24px; font-weight: 600; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #00d4ff; }
    label { display: block; font-size: 14px; color: #a1a1aa; margin-bottom: 8px; }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #00d4ff; }
    .hint { font-size: 12px; color: #71717a; margin-top: 8px; }
    .btn-row { margin-top: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%); color: #fff; }
    .btn-primary:hover { box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #e4e4e7; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
    #status {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
    #status.show { display: inline-block; }
    #status.success { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    #status.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    #status.loading { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .instructions {
      margin-top: 24px; padding: 16px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
    }
    .instructions h3 { font-size: 14px; color: #00d4ff; margin-bottom: 12px; }
    .instructions ol { padding-left: 20px; font-size: 13px; line-height: 1.8; color: #a1a1aa; }
    code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">IS</div>
      <h1>Settings</h1>
    </div>
    
    <div class="card">
      <div class="card-title">🌐 Server Configuration</div>
      <label for="serverUrl">Inference Server URL</label>
      <input type="text" id="serverUrl" value="http://127.0.0.1:5000" placeholder="https://xxxx.ngrok-free.app">
      <div class="hint">Paste your ngrok URL from Google Colab here</div>
      
      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">💾 Save Settings</button>
        <button class="btn btn-secondary" id="testBtn">🔗 Test Connection</button>
        <span id="status"></span>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title">📖 Quick Setup</div>
      <div class="instructions">
        <h3>Using Google Colab:</h3>
        <ol>
          <li>Run your Colab notebook with the model</li>
          <li>Copy the ngrok URL (e.g., <code>https://abc-123.ngrok-free.app</code>)</li>
          <li>Paste it above and click Save</li>
          <li>Click Test to verify connection</li>
        </ol>
      </div>
    </div>
  </div>
  
  <script src="settings.js"></script>
</body>
</html>
